type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
_id:
  type: string
  description: contact id
  example: 67f66c0c833cc3418ea6469e
name:
  type: string
  description: contact name
  example: John Doe
phoneNumber:
  type: string
  description: contact number
  example: +380680000000
contactType:
  type: string
  description: contact type
  enum: ['work', 'home', 'personal']
  example: work
userId:
  type: string
  description: contact userId
  example: 67f66c0c833cc3418ea6469e
email:
  type: string
  description: email
  example: johndoe@mail.com
isFavourite:
  type: boolean
  description: is a contact maked as favourite
  example: true
  photo:
    type: string
    description: contact photo url
    example: https://res.cloudinary.com/ddzhgeqog/image/upload/v1743285304/hhlsme96fkvmdfwafn7d.jpg

createdAt: 
type: string
format: date-time
description: contact creation time
example: 2025-03-29T21:55:05.526+00:00

updatedAt:
type: string
format: date-time
description: contact edit time
example: 2025-03-29T21:55:05.526+00:00
