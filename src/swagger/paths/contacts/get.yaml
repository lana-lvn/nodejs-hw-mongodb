tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Returns a list of user contacts
security:
  - bearerAuth: []
parameters:
  - name: isFavourite
    in: query
    required: false
    description: Filter contacts by favourite status
    schema:
      type: boolean
      example: true
  - name: page
    in: query
    required: false
    description: Page number for pagination
    schema:
      type: integer
      minimum: 1
      example: 1
  - name: perPage
    in: query
    required: false
    description: Number of contacts per page
    schema:
      type: integer
      minimum: 1
      example: 10
  - name: sortBy
    in: query
    required: false
    description: Field to sort contacts by. Default is '_id'.
    schema:
      type: string
      example: 'name'
  - name: sortOrder
    in: query
    required: false
    description: Sort order for contacts. Can be 'asc' or 'desc'.
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
